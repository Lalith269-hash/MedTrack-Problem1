services:

  namenode:
    image: apache/hadoop:3.5.0
    container_name: namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - namenode_data:/opt/hadoop/data
      - ./hadoop/config:/opt/hadoop/etc/hadoop

  datanode:
    image: apache/hadoop:3.5.0
    container_name: datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    ports:
      - "9864:9864"
    volumes:
      - datanode_data:/opt/hadoop/data
      - ./hadoop/config:/opt/hadoop/etc/hadoop

  resourcemanager:
    image: apache/hadoop:3.5.0
    container_name: resourcemanager
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    depends_on:
      - namenode
    ports:
      - "8088:8088"
    volumes:
      - ./hadoop/config:/opt/hadoop/etc/hadoop

  nodemanager:
    image: apache/hadoop:3.5.0
    container_name: nodemanager
    hostname: nodemanager
    command: ["yarn", "nodemanager"]
    depends_on:
      - resourcemanager
    ports:
      - "8042:8042"
    volumes:
      - ./hadoop/config:/opt/hadoop/etc/hadoop

volumes:
  namenode_data:
  datanode_data:
